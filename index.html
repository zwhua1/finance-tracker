<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兔子团队财务对账表</title>
    <!-- 使用系统字体，避免 Google Fonts 被墙问题 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e8eef5 100%);
            color: #1a2332;
            line-height: 1.6;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 32px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1rem;
            color: #64748b;
            font-weight: 500;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07), 0 1px 3px rgba(0, 0, 0, 0.06);
            padding: 24px;
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 12px 16px rgba(0, 0, 0, 0.1), 0 3px 6px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
        }

        .card h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }

        .expense-list {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 16px;
        }

        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            font-size: 0.9rem;
            border-radius: 6px;
            margin-bottom: 6px;
            transition: background-color 0.2s;
        }

        .expense-item:hover {
            background-color: #f8fafc;
        }

        .expense-date {
            color: #64748b;
            font-size: 0.85rem;
        }

        .expense-amount {
            font-weight: 600;
            color: #1e293b;
        }

        .summary-box {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border: 2px solid #fcd34d;
            border-radius: 10px;
            padding: 16px;
            margin-top: 16px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: #1a1a1a;
        }

        .fund-item {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .fund-date {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 4px;
        }

        .fund-amount {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .fund-desc {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .employee-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .employee-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            font-size: 0.9rem;
            border-radius: 6px;
            margin-bottom: 6px;
            transition: background-color 0.2s;
        }

        .employee-item:hover {
            background-color: #f8fafc;
        }

        .employee-item.short-term {
            background-color: #fee2e2;
            color: #991b1b;
            font-weight: 600;
        }

        .employee-name {
            flex: 1;
        }

        .employee-amount {
            font-weight: 600;
            color: #1e293b;
        }

        .dashboard {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 20px 25px rgba(0, 0, 0, 0.15);
            margin-bottom: 32px;
        }

        .dashboard h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
        }

        .metric-label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
        }

        .status-box {
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            border: 2px solid;
        }

        .status-balanced {
            background-color: rgba(34, 197, 94, 0.2);
            border-color: #22c55e;
            color: #86efac;
        }

        .status-unbalanced {
            background-color: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #fca5a5;
        }

        footer {
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
        }

        /* Scrollbar styling */
        .expense-list::-webkit-scrollbar,
        .employee-list::-webkit-scrollbar {
            width: 6px;
        }

        .expense-list::-webkit-scrollbar-track,
        .employee-list::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }

        .expense-list::-webkit-scrollbar-thumb,
        .employee-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .expense-list::-webkit-scrollbar-thumb:hover,
        .employee-list::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .grid-3 {
                grid-template-columns: 1fr;
            }

            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .dashboard {
                padding: 20px;
            }

            .dashboard h3 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>兔子团队财务对账表</h1>
            <p class="subtitle">完整明细录入 | 更新时间2月14日</p>
        </header>

        <!-- Main Grid -->
        <div class="grid-3">
            <!-- Left: Daily Expenses -->
            <div class="card">
                <h2>一、每日费用明细流水</h2>
                <div class="expense-list" id="expenseList"></div>
                <div class="summary-box">
                    <div class="summary-row">
                        <span>流水总计</span>
                        <span id="totalExpense">$0.00</span>
                    </div>
                </div>
            </div>

            <!-- Middle: Fund Tracking -->
            <div class="card">
                <h2>二、资金往来核算</h2>
                <div id="fundList"></div>
                <div class="summary-box">
                    <div class="summary-row">
                        <span>下发总计</span>
                        <span id="totalFund">$0.00</span>
                    </div>
                </div>
            </div>

            <!-- Right: Personal Summary -->
            <div class="card">
                <h2>三、个人费用汇总</h2>
                <div class="employee-list" id="employeeList"></div>
                <div class="summary-box">
                    <div class="summary-row">
                        <span>个人汇总总计</span>
                        <span id="totalPersonal">$0.00</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Audit Dashboard -->
        <div class="dashboard">
            <h3>【 核心财务对账看板 - 最终数据校验 】</h3>
            <div class="metrics-grid">
                <div class="metric">
                    <div class="metric-label">下发总额</div>
                    <div class="metric-value" id="dashFund">$0.00</div>
                </div>
                <div class="metric">
                    <div class="metric-label">消费总额</div>
                    <div class="metric-value" id="dashExpense">$0.00</div>
                </div>
                <div class="metric">
                    <div class="metric-label">理论余额</div>
                    <div class="metric-value" id="dashBalance">$0.00</div>
                </div>
                <div class="metric">
                    <div class="metric-label">实际支出</div>
                    <div class="metric-value" id="dashActual">$0.00</div>
                </div>
                <div class="metric">
                    <div class="metric-label">可用余额</div>
                    <div class="metric-value" id="dashRemaining">$0.00</div>
                </div>
            </div>
            <div class="status-box" id="statusBox">✅ 平账状态：金额完全吻合</div>
        </div>

        <!-- Footer -->
        <footer>
            报告生成时间：2026年2月14日 | 自动对账系统最终版 v5.0
        </footer>
    </div>

    <script>
        // Data
        const employees = [
            { name: '小磊', room: '7704', days: 6 }, { name: '阿楠', room: '6607', days: 6 },
            { name: '鹏程', room: '7716', days: 6 }, { name: '小明', room: '7709', days: 6 },
            { name: '阿耀', room: '7717', days: 6 }, { name: '红牛', room: '5512', days: 6 },
            { name: '阿江', room: '6615', days: 6 }, { name: '阿喜', room: '6617', days: 6 },
            { name: '阿英', room: '7703', days: 6 }, { name: '阿天', room: '7704', days: 6 },
            { name: '阿刚', room: '6607', days: 6 }, { name: '小胖', room: '7716', days: 6 },
            { name: '大宝', room: '7709', days: 6 }, { name: '飞飞', room: '7705', days: 6 },
            { name: 'A6', room: '7717', days: 6 }, { name: 'A7', room: '5512', days: 6 },
            { name: '眼镜', room: '6615', days: 6 }, { name: '山鸡', room: '6617', days: 6 },
            { name: '阿里', room: '7703', days: 6 }, { name: '吞吞', room: '7704', days: 6 },
            { name: '阿嫖', room: '7705', days: 6 },
            { name: '阿水', room: '5512', days: 1, short: true }, { name: '阿鑫', room: '6615', days: 1, short: true },
            { name: '阿昊', room: '6617', days: 1, short: true }, { name: '凌枫', room: '7703', days: 1, short: true }
        ];

        const roomPrice = 18.4615;
        const mealPrice = 11.5;

        // Generate expenses
        const expenses = [];
        employees.forEach(emp => {
            for (let i = 1; i <= emp.days; i++) {
                expenses.push({ date: `02/${8 + i}`, employee: emp.name, description: `住宿分摊(${emp.room})`, amount: roomPrice });
                expenses.push({ date: `02/${8 + i}`, employee: emp.name, description: '餐饮及饮水(含宵夜)', amount: mealPrice });
            }
        });
        expenses.push({ date: '02/09', employee: '公共项目', description: '交通油费(3辆车)', amount: 306 });
        expenses.push({ date: '02/09', employee: '公共项目', description: '阿嫖离职补偿', amount: 250 });

        const funds = [
            { date: '02/09', amount: 5000, rate: 1.0, description: '首批预拨资金' }
        ];

        // Calculate totals
        const totalExpense = expenses.reduce((s, e) => s + e.amount, 0);
        const totalFund = funds.reduce((s, f) => s + f.amount, 0);

        const employeeSummary = {};
        employees.forEach(emp => {
            employeeSummary[emp.name] = expenses
                .filter(e => e.employee === emp.name)
                .reduce((s, e) => s + e.amount, 0);
        });

        const totalPersonal = Object.values(employeeSummary).reduce((s, v) => s + v, 0);
        const publicExpense = expenses
            .filter(e => e.employee === '公共项目')
            .reduce((s, e) => s + e.amount, 0);

        const balance = totalFund - totalExpense;
        const isBalanced = Math.abs(balance) < 0.01;

        // Render expenses
        const expenseList = document.getElementById('expenseList');
        expenses.slice(0, 20).forEach(exp => {
            const div = document.createElement('div');
            div.className = 'expense-item';
            div.innerHTML = `
                <span class="expense-date">${exp.date} - ${exp.employee}</span>
                <span class="expense-amount">$${exp.amount.toFixed(2)}</span>
            `;
            expenseList.appendChild(div);
        });
        if (expenses.length > 20) {
            const moreDiv = document.createElement('div');
            moreDiv.style.textAlign = 'center';
            moreDiv.style.color = '#94a3b8';
            moreDiv.style.fontSize = '0.8rem';
            moreDiv.style.padding = '8px';
            moreDiv.textContent = `... 还有 ${expenses.length - 20} 条记录`;
            expenseList.appendChild(moreDiv);
        }
        document.getElementById('totalExpense').textContent = `$${totalExpense.toFixed(2)}`;

        // Render funds
        const fundList = document.getElementById('fundList');
        funds.forEach(fund => {
            const div = document.createElement('div');
            div.className = 'fund-item';
            div.innerHTML = `
                <div class="fund-date">${fund.date}</div>
                <div class="fund-amount">$${fund.amount.toFixed(2)}</div>
                <div class="fund-desc">${fund.description}</div>
            `;
            fundList.appendChild(div);
        });
        document.getElementById('totalFund').textContent = `$${totalFund.toFixed(2)}`;

        // Render employees
        const employeeList = document.getElementById('employeeList');
        employees.forEach(emp => {
            const div = document.createElement('div');
            div.className = `employee-item ${emp.short ? 'short-term' : ''}`;
            div.innerHTML = `
                <span class="employee-name">${emp.name} (${emp.room})</span>
                <span class="employee-amount">$${(employeeSummary[emp.name] || 0).toFixed(2)}</span>
            `;
            employeeList.appendChild(div);
        });
        document.getElementById('totalPersonal').textContent = `$${(totalPersonal + publicExpense).toFixed(2)}`;

        // Update dashboard
        document.getElementById('dashFund').textContent = `$${totalFund.toFixed(2)}`;
        document.getElementById('dashExpense').textContent = `$${totalExpense.toFixed(2)}`;
        document.getElementById('dashBalance').textContent = `$${balance.toFixed(2)}`;
        document.getElementById('dashActual').textContent = `$${(totalPersonal + publicExpense).toFixed(2)}`;
        document.getElementById('dashRemaining').textContent = `$${balance.toFixed(2)}`;

        // Update status
        const statusBox = document.getElementById('statusBox');
        if (isBalanced) {
            statusBox.className = 'status-box status-balanced';
            statusBox.textContent = '✅ 平账状态：金额完全吻合';
        } else {
            statusBox.className = 'status-box status-unbalanced';
            statusBox.textContent = '❌ 错误：金额不匹配';
        }
    </script>
</body>
</html>
